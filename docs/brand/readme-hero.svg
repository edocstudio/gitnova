<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">GitNova — Git made simple.</title>
<desc id="desc">The original blue orbital nova mark beside the GitNova wordmark. Colorful Git paths meet and branch against a deep navy background. Every repository. Every change. By edocstudio.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#132a3c"/><stop offset="1" stop-color="#0a131e"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#367ef1" stop-opacity=".16"/><stop offset="1" stop-color="#367ef1" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#294057" stroke-width=".7" opacity=".32"/></pattern>
</defs>
<rect x="1" y="1" width="1278" height="358" rx="22" fill="url(#background)" stroke="#284159"/>
<rect x="780" y="1" width="499" height="358" rx="22" fill="url(#grid)"/>
<ellipse cx="1030" cy="170" rx="240" ry="200" fill="url(#light)"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<text x="64" y="55" fill="#87a6c3" font-size="12" letter-spacing="3">OPEN SOURCE / LOCAL FIRST</text>
<g transform="translate(61 90) scale(1.48)" color="#4b91ff"><g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M16 14C7 20 5 31 10 40c4 8 12 12 22 12" stroke="currentColor" stroke-width="3.5"/>
  <path d="M48 50c9-6 11-17 6-26-4-8-12-12-22-12" stroke="currentColor" stroke-width="3.5"/>
</g>
<path d="M32 14c2.5 11 7 15.5 18 18-11 2.5-15.5 7-18 18-2.5-11-7-15.5-18-18 11-2.5 15.5-7 18-18Z" fill="currentColor"/>
<circle cx="16" cy="14" r="4.5" fill="currentColor"/>
<circle cx="48" cy="50" r="4.5" fill="currentColor"/></g>
<text x="178" y="161" fill="#e5edf6" font-size="76" font-weight="700" letter-spacing="-3">GitNova</text>
<text x="67" y="224" fill="#dce9f7" font-size="34" font-weight="500" letter-spacing="-.7">Git made simple.</text>
<text x="68" y="263" fill="#97b1cb" font-size="21">Every repository. Every change.</text>
<text x="68" y="321" fill="#7996b1" font-size="12" letter-spacing="1.8">BUILT WITH RUST + TAURI</text>
<text x="1190" y="321" text-anchor="end" fill="#93adc6" font-size="13">by edocstudio</text>
</g>
<!-- An abstract Git graph, not a screenshot or a feature/status claim. -->
