[package]
name = "gitnova-hosting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
gitnova-domain = { path = "../gitnova-domain" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
url = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "native-tls", "system-proxy"] }
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
dbus-secret-service = { version = "4.1", default-features = false, features = ["crypto-rust"] }
