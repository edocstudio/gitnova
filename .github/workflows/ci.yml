name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude gitnova-desktop --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude gitnova-desktop --locked
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: cargo clippy -p gitnova-desktop --locked -- -D warnings
      - run: cargo test -p gitnova-desktop --locked
      - run: cargo build -p gitnova-desktop --locked
      - run: npx playwright install chromium
        working-directory: apps/desktop
      - run: npm run test:e2e
        working-directory: apps/desktop
