name: release candidate
on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Full release validation, or focused Windows diagnostics without release assembly
        type: choice
        options: [full, windows-regressions]
        default: full
      sign_linux:
        description: Sign Linux packages with the owner-configured GPG key
        type: boolean
        default: false
      draft_tag:
        description: 'Optional existing version tag at this exact commit (for example v1.0.0); attach installers to a draft release'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-checks:
    if: ${{ inputs.validation_scope != 'windows-regressions' }}
    uses: ./.github/workflows/ci.yml
    with:
      release_profile: true
  windows-regressions:
    if: ${{ inputs.validation_scope == 'windows-regressions' }}
    name: Targeted Windows checks (not release approval)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Isolate CI Git configuration
        run: python apps/desktop/scripts/prepare-ci-home.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p gitnova-git -p gitnova-submodule -p gitnova-core --all-targets --locked -- -D warnings
      - name: Native Windows path decoding
        run: cargo test -p gitnova-git --lib native_path_tests --locked
      - name: Native worktree lifecycle and submodule sync regressions
        run: cargo test -p gitnova-core --test worktree_creation --test worktree_removal --test related_maintenance --test ref_and_push --locked --no-fail-fast -- --test-threads=2
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tsc --noEmit
        working-directory: apps/desktop
      - run: npx playwright install chromium
        working-directory: apps/desktop
      - name: Real-Git stash and worktree UI regressions
        run: npx playwright test e2e/graph.spec.ts --grep "stash advanced options retain saved staging|graph creates a reviewed worktree|graph rebase recreates two-parent merges" --workers=1 --max-failures=1
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-regression-test-results
          if-no-files-found: ignore
          path: apps/desktop/test-results/
  assemble:
    if: ${{ inputs.validation_scope != 'windows-regressions' }}
    needs: native-checks
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: gitnova-native-*
          path: candidates
      - name: Assemble exact tested release candidates
        run: node apps/desktop/scripts/prepare-release.mjs candidates release-output
      - name: Import owner signing key into disposable keyring
        if: ${{ inputs.sign_linux }}
        env:
          OWNER_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          OWNER_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OWNER_KEY" && test -n "$OWNER_FINGERPRINT"
          install -d -m 700 "$RUNNER_TEMP/gitnova-release-gnupg"
          printf '%s' "$OWNER_KEY" | gpg --homedir "$RUNNER_TEMP/gitnova-release-gnupg" --batch --import
      - name: Sign and verify Linux detached signatures
        if: ${{ inputs.sign_linux }}
        env:
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          OWNER_FINGERPRINT: ${{ vars.LINUX_GPG_FINGERPRINT }}
        run: node apps/desktop/scripts/sign-linux-release.mjs release-output "$RUNNER_TEMP/gitnova-release-gnupg" "$OWNER_FINGERPRINT"
      - name: Remove disposable signing material
        if: ${{ always() && inputs.sign_linux }}
        shell: bash
        run: |
          gpgconf --homedir "$RUNNER_TEMP/gitnova-release-gnupg" --kill all || true
          rm -rf "$RUNNER_TEMP/gitnova-release-gnupg"
      - uses: actions/upload-artifact@v4
        with:
          name: gitnova-release-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            release-output/
            candidates/**/alpha-evidence/*.json
            candidates/**/dependency-inventory.json
            candidates/**/third-party-license-evidence.txt
      - name: Record handoff
        run: |
          echo 'Release candidates prepared. No GitHub Release was created; no website was deployed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review exact native artifacts, license/asset obligations and signing status before publication.' >> "$GITHUB_STEP_SUMMARY"
  draft:
    if: ${{ inputs.draft_tag != '' }}
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: gitnova-release-candidate-${{ github.sha }}
          path: draft-input
      - name: Attach tested installers to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.draft_tag }}
        run: node apps/desktop/scripts/create-release-draft.mjs draft-input/release-output "$RELEASE_TAG"
